---
apiVersion: v1
kind: ServiceAccount 
metadata: 
  name: ekart
  namespace: ekart

---
apiVersion: v1
kind: Secret
type: kubernetes.io/service-account-token
metadata: 
  name: ekart-service-token
  namespace: ekart
  annotations:
    kubernetes.io/service-account.name: ekart

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ekartClusterAdmin
  #namespace: eureka
rules:
  - apiGroups:
        - ""
        - apps
        - autoscaling
        - batch
        - extensions
        - policy
        - nodes
        - rbac.authorization.k8s.io
    resources:
      - pods
      - componentstatuses
      - configmaps
      - daemonsets
      - deployments
      - events
      - endpoints
      - horizontalpodautoscalers
      - ingress
      - jobs
      - limitranges
      - namespaces
      - nodes
      - pods
      - persistentvolumes
      - persistentvolumeclaims
      - resourcequotas
      - replicasets
      - replicationcontrollers
      - serviceaccounts
      - secrets 
      - services
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]   

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ekart-cluster-admin-role-binding
  namespace: ekart
subjects:
- kind: ServiceAccount
  name: ekart # "name" is case sensitive
  namespace: ekart
  apiGroup: ""
roleRef:
  kind: ClusterRole #this must be Role or ClusterRole
  name: ekartClusterAdmin # this must match the name of the Role or ClusterRole you wish to bind to
  apiGroup: rbac.authorization.k8s.io  