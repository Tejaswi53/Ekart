---
apiVersion: apps/v1
kind: Deployment
metadata:
  name:  ekart-deployment
  namespace: ekart
  labels:
    app: ekart 
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ekart
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: ekart
    spec:
      containers:
      - image: 987014986560.dkr.ecr.us-west-1.amazonaws.com/ekart:latest
        name:  ekart
        imagePullPolicy: IfNotPresent             
        ports:
        - containerPort:  8070
         
        
      